<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#58a6ff"/>
    <stop offset="1" stop-color="#7c72ff"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="10" y="10" width="660" height="220" rx="18"/></clipPath>
</defs>

<rect x="10" y="10" width="660" height="220" rx="18" fill="url(#bg)" stroke="#21262d"/>

<g clip-path="url(#clip)">
  <rect x="10" y="10" width="660" height="1" fill="url(#line)" opacity=".9"/>
  <circle cx="610" cy="45" r="120" fill="#58a6ff" opacity=".025"/>
  <circle cx="585" cy="55" r="70" fill="none" stroke="#58a6ff" stroke-width="1" opacity=".08">
    <animate attributeName="r" values="62;76;62" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="185" r="100" fill="#7c72ff" opacity=".02"/>
  <rect x="-180" y="224" width="180" height="2" fill="url(#line)" opacity=".75">
    <animate attributeName="x" values="-180;680" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <text x="42" y="62" font-size="12" letter-spacing="2.2" fill="#8b949e">DOUGNOG / GITHUB PROFILE</text>
  <text x="42" y="116" font-size="36" font-weight="700" fill="#f0f6fc">Douglas Nogueira</text>
  <text x="42" y="148" font-size="16" fill="#8b949e">Web &amp; Mobile Developer in Progress</text>
  <text x="42" y="184" font-size="13" fill="#c9d1d9">Building solid foundations across front-end, mobile, back-end and data.</text>

  <g transform="translate(42,200)">
    <circle cx="5" cy="5" r="4" fill="#3fb950" filter="url(#soft)">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="9" font-size="11" fill="#8b949e">learning • building • shipping</text>
  </g>
</g>

<g transform="translate(535,74)" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="95" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="47.5" y="18" font-size="11" fill="#58a6ff" text-anchor="middle">BRAZIL</text>
  <rect x="0" y="40" width="95" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="47.5" y="58" font-size="11" fill="#c9d1d9" text-anchor="middle">WEB</text>
  <rect x="0" y="80" width="95" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="47.5" y="98" font-size="11" fill="#c9d1d9" text-anchor="middle">MOBILE</text>
</g>
</svg>