<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="screen"><rect x="10" y="44" width="660" height="226"/></clipPath>
  <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00d9ff" stop-opacity=".10"/>
    <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="cursorGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="10" y="10" width="660" height="260" rx="12" fill="#0d1117" stroke="#21262d"/>
<rect x="10" y="10" width="660" height="34" rx="12" fill="#161b22"/>
<rect x="10" y="28" width="660" height="16" fill="#161b22"/>
<circle cx="32" cy="27" r="5" fill="#ff5f56"/>
<circle cx="50" cy="27" r="5" fill="#ffbd2e"/>
<circle cx="68" cy="27" r="5" fill="#27c93f"/>
<text x="340" y="31" font-family="monospace" font-size="11" fill="#6b7280" text-anchor="middle">dougnog@dev ~</text>
<line x1="10" y1="44" x2="670" y2="44" stroke="#21262d" stroke-width=".5"/>

<g clip-path="url(#screen)">
  <rect x="10" y="44" width="660" height="1" fill="url(#scanline)" opacity=".7">
    <animate attributeName="y" values="44;268;44" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>

<g font-family="monospace" font-size="13">

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.015;.22;.245;1" dur="16s" repeatCount="indefinite"/>
    <text x="30" y="75" fill="#27c93f">➜</text><text x="50" y="75" fill="#00d9ff">~</text>
    <text x="70" y="75" fill="#e6edf3">whoami</text>
    <text x="30" y="100" fill="#6c63ff">DougNog</text>
    <text x="30" y="125" fill="#6b7280">// web &amp; mobile developer from Brazil</text>
    <text x="30" y="160" fill="#27c93f">➜</text><text x="50" y="160" fill="#00d9ff">~</text>
    <text x="70" y="160" fill="#e6edf3">cat skills.json</text>
    <text x="30" y="185" fill="#e6edf3">{</text>
    <text x="50" y="205" fill="#f7df1e">&quot;languages&quot;</text><text x="155" y="205" fill="#e6edf3">: [</text>
    <text x="195" y="205" fill="#00d9ff">&quot;HTML&quot;, &quot;CSS&quot;, &quot;JS&quot;, &quot;Python&quot;, &quot;Dart&quot;</text><text x="535" y="205" fill="#e6edf3">],</text>
    <text x="50" y="225" fill="#f7df1e">&quot;database&quot;</text><text x="145" y="225" fill="#e6edf3">:</text>
    <text x="165" y="225" fill="#00d9ff">&quot;MySQL&quot;</text><text x="30" y="245" fill="#e6edf3">}</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.235;.26;.47;.495;1" dur="16s" repeatCount="indefinite"/>
    <text x="30" y="75" fill="#27c93f">➜</text><text x="50" y="75" fill="#00d9ff">~</text>
    <text x="70" y="75" fill="#e6edf3">ls ~/learning</text>
    <text x="30" y="100" fill="#00d9ff">flutter/</text><text x="130" y="100" fill="#00d9ff">react/</text>
    <text x="210" y="100" fill="#00d9ff">node/</text><text x="280" y="100" fill="#00d9ff">git/</text><text x="340" y="100" fill="#00d9ff">docker/</text>
    <text x="30" y="135" fill="#27c93f">➜</text><text x="50" y="135" fill="#00d9ff">~</text>
    <text x="70" y="135" fill="#e6edf3">echo $CURRENT_FOCUS</text>
    <text x="30" y="160" fill="#f7df1e">&quot;Aprender construindo projetos reais&quot;</text>
    <text x="30" y="195" fill="#27c93f">➜</text><text x="50" y="195" fill="#00d9ff">~</text>
    <text x="70" y="195" fill="#e6edf3">uptime</text>
    <text x="30" y="220" fill="#6b7280">coding daily • never stop learning</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.485;.51;.72;.745;1" dur="16s" repeatCount="indefinite"/>
    <text x="30" y="75" fill="#27c93f">➜</text><text x="50" y="75" fill="#00d9ff">~</text>
    <text x="70" y="75" fill="#e6edf3">git log --oneline</text>
    <text x="30" y="100" fill="#f7df1e">c4f3b42</text><text x="95" y="100" fill="#e6edf3">feat: aprendendo flutter</text>
    <text x="30" y="120" fill="#f7df1e">a1b2c3d</text><text x="95" y="120" fill="#e6edf3">fix: bug no javascript</text>
    <text x="30" y="140" fill="#f7df1e">9e8d7f6</text><text x="95" y="140" fill="#e6edf3">docs: novo readme</text>
    <text x="30" y="160" fill="#f7df1e">5a4b3c2</text><text x="95" y="160" fill="#e6edf3">feat: primeiro commit</text>
    <text x="30" y="195" fill="#27c93f">➜</text><text x="50" y="195" fill="#00d9ff">~</text>
    <text x="70" y="195" fill="#e6edf3">git status</text>
    <text x="30" y="220" fill="#00d9ff">On branch main</text>
    <text x="30" y="240" fill="#27c93f">nothing to commit, working tree ready</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.735;.76;.97;1" dur="16s" repeatCount="indefinite"/>
    <text x="30" y="75" fill="#27c93f">➜</text><text x="50" y="75" fill="#00d9ff">~</text>
    <text x="70" y="75" fill="#e6edf3">printf &quot;next quest?&quot;</text>
    <text x="30" y="110" fill="#f7df1e">Ship. Learn. Refactor. Repeat.</text>
    <text x="30" y="145" fill="#27c93f">➜</text><text x="50" y="145" fill="#00d9ff">~</text>
    <text x="70" y="145" fill="#e6edf3">contact --github</text>
    <text x="30" y="175" fill="#00d9ff">→</text><text x="50" y="175" fill="#e6edf3">github.com/DougNog</text>
    <text x="30" y="205" fill="#27c93f">➜</text><text x="50" y="205" fill="#00d9ff">~</text>
    <text x="70" y="205" fill="#e6edf3">echo $STATUS</text>
    <text x="30" y="230" fill="#6c63ff">ready_for_next_challenge=true</text>
  </g>

  <rect x="30" y="254" width="10" height="14" rx="1" fill="#6c63ff" filter="url(#cursorGlow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
</g>

<g font-family="monospace" font-size="9">
  <text x="575" y="262" fill="#6b7280">loop: 16s</text>
  <circle cx="650" cy="259" r="3" fill="#27c93f">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>