    <text x="219" y="200" fill="#0175c2" text-anchor="middle">Dart</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" begin=".7s" repeatCount="indefinite"/>
  </g>
  <g>
