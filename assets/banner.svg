    <text x="285" y="200" fill="#e34f26" text-anchor="middle">HTML</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" begin=".95s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="322" y="185" width="50" height="22" rx="11" fill="none" stroke="#1572b6"/>
    <text x="347" y="200" fill="#1572b6" text-anchor="middle">CSS</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="380" y="185" width="60" height="22" rx="11" fill="none" stroke="#00758f"/>
    <text x="410" y="200" fill="#00758f" text-anchor="middle">MySQL</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" begin="1.45s" repeatCount="indefinite"/>
  </g>
</g>

<rect x="50" y="220" width="580" height="3" rx="1.5" fill="#1a1f2e"/>
<rect x="50" y="220" width="0" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)">
  <animate attributeName="width" values="0;580;580;0" keyTimes="0;.55;.88;1" dur="5.6s" repeatCount="indefinite"/>
</rect>
</svg>